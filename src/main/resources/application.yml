spring:
  application:
    name: project
  datasource:
    url: jdbc:h2:mem:project;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true
  h2:
    console:
      enabled: true
      path: /h2
